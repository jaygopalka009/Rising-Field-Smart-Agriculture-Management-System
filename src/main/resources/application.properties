spring.application.name=RisingField

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/risingfield
spring.data.mongodb.auto-index-creation=true

# Server
server.port=8096

# JWT
risingfield.jwt.secret=ChangeThisSecretKeyForRisingFieldPlatform1234567890SuperSecure
risingfield.jwt.expiration-ms=86400000

# Default admin (created on startup if missing)
risingfield.admin.email=admin@gmail.com
risingfield.admin.password=admin123

# File upload (equipment photos base64 allowed; keep multipart generous)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Logging
logging.level.org.springframework.data.mongodb=INFO

# Razorpay (test mode keys - get from https://dashboard.razorpay.com)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TEypJnbb44DGur}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:0NRVx3k70RN2IRIYgdzthfVv}
server.error.include-message=always
