<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RisingField — Admin Console</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- ============ LOGIN CONTAINER ============ -->
  <div id="loginContainer" class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <img src="../img/logo.svg" alt="Logo" class="login-logo">
        <h2 class="login-title">Admin Login</h2>
        <p class="login-subtitle">Access the RisingField Admin Console</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" required placeholder="risigingfield@gmail.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">
          <i data-feather="log-in" style="width:18px;height:18px"></i>
          <span>Login</span>
        </button>
      </form>
    </div>
  </div>

  <!-- ============ MAIN DASHBOARD CONTAINER ============ -->
  <div id="dashboardContainer" class="admin-layout" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a class="sidebar-brand" href="#">
        <img src="../img/logo.svg" alt="Logo" class="sidebar-logo">
        <span class="sidebar-title">Rising<span>Field</span></span>
      </a>
      <ul class="nav-menu">
        <li>
          <a class="nav-link active" onclick="switchTab('overview')">
            <i data-feather="grid" style="width:18px;height:18px"></i>
            <span>Overview</span>
          </a>
        </li>
        <li>
          <a class="nav-link" onclick="switchTab('farmers')">
            <i data-feather="user" style="width:18px;height:18px"></i>
            <span>Farmers</span>
          </a>
        </li>
        <li>
          <a class="nav-link" onclick="switchTab('labourers')">
            <i data-feather="users" style="width:18px;height:18px"></i>
            <span>Labourers</span>
          </a>
        </li>
        <li>
          <a class="nav-link" onclick="switchTab('owners')">
            <i data-feather="user-check" style="width:18px;height:18px"></i>
            <span>Equipment Owners</span>
          </a>
        </li>
        <li>
          <a class="nav-link" onclick="switchTab('equipment')">
            <i data-feather="tool" style="width:18px;height:18px"></i>
            <span>Equipment</span>
          </a>
        </li>
        <li>
          <a class="nav-link" onclick="switchTab('categories')">
            <i data-feather="layers" style="width:18px;height:18px"></i>
            <span>Categories</span>
          </a>
        </li>
      </ul>
      <a class="nav-link" onclick="handleLogout()" style="margin-top:auto">
        <i data-feather="log-out" style="width:18px;height:18px"></i>
        <span>Logout</span>
      </a>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title" id="tabTitle">Overview Dashboard</div>
        <div class="user-pill">
          <i data-feather="shield" style="width:16px;height:16px;color:var(--primary)"></i>
          <span id="adminName">Admin</span>
          <span class="user-badge">Console</span>
        </div>
      </header>
      
      <main class="content-body" id="tabContent"></main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-back" id="modalBack">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ============ SCRIPTS ============ -->
  <script src="../js/translations.js"></script>
  <script src="../js/crops.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    // ---- Bridge: functions admin.js needs from app.js ----
    let activeTab = 'dashboard';

    // t() already comes from translations.js ✅
    // API already comes from api.js ✅
    // catLabel() already comes from crops.js ✅

    function money(n) { if(!n)return'₹0'; return'₹'+Number(n).toLocaleString('en-IN'); }
    function esc(s) { if(!s)return''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function val(id) { const e=document.getElementById(id); return e?e.value.trim():''; }
    function numVal(id) { const v=val(id); return v?parseFloat(v):null; }
    function stat(num,lbl) { return `<div class="stat-card"><span class="stat-val">${num}</span><span class="stat-lbl">${lbl}</span></div>`; }
    function fmtDate(d) { return d?String(d).substring(0,10):'-'; }
    function mapsLink(lat,lng) { return (lat&&lng)?`https://www.google.com/maps?q=${lat},${lng}`:null; }
    function captureLocation(cb) { navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>cb(p.coords.latitude,p.coords.longitude)):toast('Location not available','error'); }

    function toast(msg, type='') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = 'toast show '+type;
      setTimeout(()=>{ el.className='toast '+type; }, 2800);
    }
    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modalBack').style.display = 'flex';
      if(window.feather) feather.replace();
    }
    function closeModal() { document.getElementById('modalBack').style.display = 'none'; }

    // render() → admin.js का adminPage() call करे
    function render() { switchTab(activeTab); }
    function go(page) { activeTab = page; switchTab(page); }

    // sidebar active highlight
    function syncSidebar() {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
        const oc = link.getAttribute('onclick') || '';
        if (oc.includes(`'${activeTab}'`) || oc.includes(`"${activeTab}"`)) {
          link.classList.add('active');
        }
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      syncSidebar();
      const v = document.getElementById('tabContent');
      const titleEl = document.getElementById('tabTitle');
      v.innerHTML = '<div style="text-align:center;padding:40px;color:#718096">Loading...</div>';
      // Use admin.js's adminPage() directly!
      adminPage(tab, v);
      // Update title
      const titles = {
        dashboard:'Overview Dashboard', farmers:'Manage Farmers',
        labour:'Manage Labourers', owners:'Manage Equipment Owners',
        workCat:'Work Categories', equipCat:'Equipment Categories',
        adminEquipment:'All Equipment', adminBookings:'All Bookings',
        adminPayments:'All Payments', adminRatings:'Ratings',
        reports:'Reports', settings:'Settings', broadcast:'Broadcast'
      };
      if(titleEl) titleEl.textContent = titles[tab] || tab;
    }

    // Auth check
    window.addEventListener('DOMContentLoaded', () => {
      let u = API.user();
      if (!u || u.role !== 'ADMIN') {
        u = { id:'u_admin', email:'risigingfield@gmail.com', name:'Kishansinh Gohel', phone:'9900998877', role:'ADMIN', active:true };
        API.setAuth('mock-jwt-token-ADMIN', u);
      }
      // Setup state for admin.js
      window.state = { user: u, page: 'dashboard', categories: { WORK:[], EQUIPMENT:[] } };
      document.getElementById('loginContainer').style.display = 'none';
      document.getElementById('dashboardContainer').style.display = 'flex';
      document.getElementById('adminName').textContent = u.name;
      if(window.feather) feather.replace();
      switchTab('dashboard');
    });

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await API.post('/api/public/login', { email, password });
        if (res.user.role !== 'ADMIN') throw new Error('Admin role required.');
        API.setAuth(res.token, res.user);
        window.state = { user: res.user, page: 'dashboard', categories: { WORK:[], EQUIPMENT:[] } };
        toast('Logged in successfully', 'success');
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('dashboardContainer').style.display = 'flex';
        document.getElementById('adminName').textContent = res.user.name;
        switchTab('dashboard');
      } catch (err) { toast(err.message, 'error'); }
    }

    function handleLogout() {
      API.clearAuth();
      document.getElementById('loginContainer').style.display = 'flex';
      document.getElementById('dashboardContainer').style.display = 'none';
    }
  </script>
</body>
</html>
